name: Release

# A tag `v<version>` builds every installer, signs the updater files and opens a DRAFT release.
# Publishing the draft (by hand, on GitHub) is what makes it the download and the update.
# Pull requests that touch packaging build everything without signing, as a check.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - src-tauri/Cargo.toml
      - src-tauri/capabilities/**
      - scripts/install.*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x64
            # The oldest supported Ubuntu, so the AppImage runs on older glibc too.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::tag v$tag does not match tauri.conf.json version $app"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - run: bun install --frozen-lockfile

      - name: Build, sign and draft the release
        if: env.PUBLISH == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Wrangl __VERSION__
          releaseBody: See the changelog at https://wrangl-docs.pages.dev/docs/changelog
          releaseDraft: true
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      # Without the release key: build every installer, skip the updater signatures.
      - name: Build (check only)
        if: env.PUBLISH != 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          args: >-
            --target ${{ matrix.target }}
            --config {"bundle":{"createUpdaterArtifacts":false}}

      - name: Keep the installers
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wrangl-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7
