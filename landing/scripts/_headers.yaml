- path: "/*"
  headers:
    Content-Security-Policy:
      default-src: ["'self'"]
      script-src:
        [
          "'self'",
          "{{CSP_SCRIPT_HASHES}}",
        ]
      style-src: ["'self'", "'unsafe-inline'", "https://fonts.googleapis.com"]
      img-src:
        [
          "'self'",
          "data:",
        ]
      media-src: ["'self'"]
      font-src: ["'self'", "https://fonts.gstatic.com"]
      frame-src: ["'self'"]
      connect-src:
        [
          "'self'",
        ]
      base-uri: ["'none'"]
      form-action: ["'self'"]
      frame-ancestors: ["'none'"]
      object-src: ["'none'"]
      upgrade-insecure-requests: true

    Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options: DENY
    X-Content-Type-Options: nosniff
    Referrer-Policy: no-referrer

    Permissions-Policy:
      camera: []
      microphone: []
      geolocation: []
      usb: []
      bluetooth: []
      hid: []
      serial: []
      magnetometer: []
      accelerometer: []
      gyroscope: []
      payment: []
      publickey-credentials-get: []
      autoplay: ["self"]
      fullscreen: ["self"]
      sync-xhr: []
      display-capture: []
      xr-spatial-tracking: []

    "! Access-Control-Allow-Origin": ~
    Cross-Origin-Opener-Policy: same-origin
    Cross-Origin-Embedder-Policy: credentialless
    Cross-Origin-Resource-Policy: same-origin

# The docs site (website-docs, copied to dist/docs by the deploy) ships its own
# inline scripts and loads the API reference from a CDN, so the landing CSP
# above, whose script hashes come from dist/index.html, would block it.
- path: "/docs/*"
  headers:
    "! Content-Security-Policy": ~
    "! Cross-Origin-Embedder-Policy": ~
