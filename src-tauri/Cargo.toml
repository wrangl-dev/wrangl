[package]
name = "wrangl"
version = "0.2.0"
description = "The agent terminal for Robinhood Chain"
license = "MIT"
edition = "2021"
rust-version = "1.85"
default-run = "wrangl"

[lib]
name = "wrangl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-log = "2"
portable-pty = "0.9"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process"] }
tower-http = { version = "0.6", features = ["fs"] }
env_logger = "0.11"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
agent-client-protocol = { version = "1", features = ["unstable_auth_methods"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.28"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
