[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
# The plugin SDK and examples build for wasm32 in a workspace of their own (`cargo xtask plugins`).
exclude = ["plugins"]

[workspace.package]
version = "0.15.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# internal
corral-geom = { path = "crates/geom" }
corral-color = { path = "crates/color" }
corral-doc = { path = "crates/doc" }
corral-layout = { path = "crates/layout" }
corral-text = { path = "crates/text" }
corral-pathops = { path = "crates/pathops" }
corral-render = { path = "crates/render" }
corral-svg = { path = "crates/svg" }
corral-pdf = { path = "crates/pdf" }
corral-vectordrawable = { path = "crates/vectordrawable" }
corral-format = { path = "crates/format" }
corral-tools = { path = "crates/tools" }
corral-collab = { path = "crates/collab" }
corral-engine = { path = "crates/engine" }
corral-ui-egui = { path = "crates/ui-egui" }
corral-mcp = { path = "crates/mcp" }
corral-collab-net = { path = "crates/collab-net" }
corral-plugin = { path = "crates/plugin" }

# craft-libs crates, vendored in ../craft (license notices: src-tauri/resources/licenses/craft-libs.md).
# Which paths stored in a document may be followed.
craft-docpath = { version = "0.1.0", path = "../craft/crates/docpath" }
# Font store: exact lookup of a missing font in the pinned Google Fonts and Noto indexes, and
# checksum-verified installs.
craft-font-store = { path = "../craft/crates/font-store" }
craft-font-catalog = { path = "../craft/crates/font-catalog" }
# Shared dropdown menus: a combo box whose menu grows back after shrinking.
craft-ui = { path = "../craft/crates/ui" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
# Command-line parsing for corral-cli (craft-contrib RFC-0012: clap derive, as photocraft does).
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
regex = "1.13"
log = "0.4"
same-file = "1.0.6"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
proptest = "1"
imbl = { version = "7", features = ["serde"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

# rendering / formats
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
# Already built for `image`: embedded ICC profiles (moxcms) and PNG colour chunks (png).
moxcms = "0.8"
png = "0.18"
usvg = "0.48"
krilla = "0.8"
skrifa = "0.47"
harfrust = "0.13"
unicode-bidi = "0.3"
unicode-segmentation = "1.13"
# Line breaks between the words of Thai, Lao, Khmer and Burmese, which are written without spaces
# (#1219): ICU4X's line segmenter with its compiled data (pure Rust, Unicode-3.0 like the icu_*
# crates already in the lock, whose version it matches). corral-text picks the dictionaries, or
# in the browser the smaller LSTM models.
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
# Code export: layer names transliterated into ASCII identifiers (pure Rust data tables, zero
# dependencies, BSD-3-Clause, no_std so the web build keeps it too).
deunicode = "1.6"
linesweeper = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# `.fig` import: raw deflate chunks (already built for zip) and zstd chunks (pure Rust, MIT, wasm-safe).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
sha1 = "0.11"
sha2 = "0.10"
base64 = "0.22"
crc32fast = "1"

# plugins: a pure-Rust, metered WebAssembly interpreter (no JIT; also runs in the web build). The
# portable dispatch loop: tail-call dispatch relies on an LLVM optimisation that unoptimised and
# debug builds may not do, and then a long-running plugin overflows the native stack.
wasmi = { version = "2", default-features = false, features = ["std", "stable", "validate", "portable-dispatch"] }
wat = "1.261"

# ui
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
rfd = "0.17"
arboard = { version = "3.6", default-features = false }
webbrowser = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
# Style lints from newer toolchains that fight index-heavy pixel code.
needless_range_loop = "allow"
chunks_exact_to_as_chunks = "allow"
# Corral never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Never crash). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# Workspace crates keep file:line in panic backtraces; dependencies carry no debug info. Both make
# the test build faster and the target dir smaller.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 4

# The browser build only (apps/corral-web/index.html: data-cargo-profile). Optimised for size:
# packaging/web/package.sh fails a .wasm over 24 MiB (Cloudflare's per-file cap is 25 MiB).
# wasm32-unknown-unknown always aborts on panic, so panic = "abort" changes nothing there.
[profile.web-release]
inherits = "release"
# "z", not "s": 1.9 MB smaller (24.0 MiB -> 22.2 MiB after wasm-opt, 0.11.1), back under the gate.
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = false
strip = true
panic = "abort"

# The egui family and winit with the fork patches listed in ../egui/PATCHES.md and ../winit/PATCHES.md,
# vendored in ../egui and ../winit.
[patch.crates-io]
ecolor = { path = "../egui/crates/ecolor" }
emath = { path = "../egui/crates/emath" }
epaint = { path = "../egui/crates/epaint" }
epaint_default_fonts = { path = "../egui/crates/epaint_default_fonts" }
egui = { path = "../egui/crates/egui" }
egui-winit = { path = "../egui/crates/egui-winit" }
egui-wgpu = { path = "../egui/crates/egui-wgpu" }
egui_extras = { path = "../egui/crates/egui_extras" }
eframe = { path = "../egui/crates/eframe" }
winit = { path = "../winit" }

# Vendored krilla 0.8.2 (../craft/krilla): decoded PNGs are capped at 1 GiB and reserved
# fallibly, and a panic while drawing unwinds without aborting.
krilla = { path = "../craft/krilla" }
