[package]
name = "corral-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Corral egui frontend (the Figma-style UI: canvas, toolbar, layers, design and prototype panels, menus); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
corral-geom = { workspace = true }
corral-color = { workspace = true }
corral-doc = { workspace = true }
corral-text = { workspace = true }
corral-layout = { workspace = true }
corral-render = { workspace = true }
corral-pathops = { workspace = true }
corral-engine = { workspace = true }
corral-format = { workspace = true }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
egui_extras = { workspace = true }
web-time = "1.1.0"

[build-dependencies]
toml = "1"

[dev-dependencies]
wat = { workspace = true }
# Keep the test font features explicit; production uses the same bundled fallback faces.
# Dependency dev-features do not propagate into app release builds.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }

